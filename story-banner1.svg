<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Station Echo-7</title>
  <desc id="desc">A stylized space station banner in orbit.</desc>
  <defs>
